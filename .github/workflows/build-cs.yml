name: Build, Test and Release (C#)

on:
  # Cada ejecución manual genera su propio release en borrador.
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Directory.Build.props define la versión; en lanzamientos por tag debe coincidir.
  version:
    name: Validate release version
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Resolve version and validate automatic release
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          $metadata = dotnet msbuild src/Qapptia.Core/Qapptia.Core.csproj -nologo -getProperty:Version,VersionSuffix
          if ($LASTEXITCODE -ne 0) { throw 'Failed to read the project version.' }
          $properties = ($metadata | ConvertFrom-Json).Properties
          if ($env:RELEASE_EVENT -eq 'push' -and $env:RELEASE_TAG -cne "v$($properties.Version)") {
            throw "Tag '$env:RELEASE_TAG' does not match Directory.Build.props: v$($properties.Version)."
          }
          "version=$($properties.Version)" >> $env:GITHUB_OUTPUT
          "prerelease=$((-not [string]::IsNullOrEmpty($properties.VersionSuffix)).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  build:
    name: Build, Test and Package (Windows)
    needs: version
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # PackageAll compila, ejecuta las pruebas y genera los tres paquetes de Windows.
      # Inno Setup se obtiene del entorno preinstalado de GitHub.
      - name: Build, test and package Windows
        shell: pwsh
        run: ./build.ps1 -PackageAll

      # Vincula los hashes de los paquetes con el repositorio, el commit y el workflow.
      - name: Attest Windows packages
        uses: actions/attest@v4
        with:
          subject-path: dist/Qapptia-v${{ needs.version.outputs.version }}-win-x64-*

      # Cada paquete se almacena como un artefacto independiente.
      - name: Store Windows portable light
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: error
          path: dist/Qapptia-v${{ needs.version.outputs.version }}-win-x64-portable-light.zip

      - name: Store Windows portable
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: error
          path: dist/Qapptia-v${{ needs.version.outputs.version }}-win-x64-portable.zip

      - name: Store Windows installer
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: error
          path: dist/Qapptia-v${{ needs.version.outputs.version }}-win-x64-setup.exe

  release:
    name: Create release
    # El release depende de la validación de versión y del empaquetado.
    needs: [version, build]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      DRAFT_TAG: workflow-test-${{ github.run_id }}-${{ github.run_attempt }}
      # Enlaces públicos incluidos en los manifiestos de actualización.
      RELEASE_DOWNLOAD_URL: https://qapptia.com/download
      RELEASE_SPONSOR_URL: https://qapptia.com/sponsor
      # Descripción compartida; GitHub añade las notas automáticas al final.
      RELEASE_DESCRIPTION: |
        ## Windows (64-bit)

        1. **Installer — `*-setup.exe`:** installs for the current user or all users.
        2. **Self-contained portable — `*-portable.zip`:** includes the .NET runtime; no installation required.
        3. **Lightweight portable — `*-portable-light.zip`:** requires the .NET runtime; no installation required.

        Download each package separately from **Assets**.
      RELEASE_FILES: |
        dist/Qapptia-v${{ needs.version.outputs.version }}-win-x64-portable-light.zip
        dist/Qapptia-v${{ needs.version.outputs.version }}-win-x64-portable.zip
        dist/Qapptia-v${{ needs.version.outputs.version }}-win-x64-setup.exe
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Qapptia-v${{ needs.version.outputs.version }}-win-x64-*
          path: dist
          merge-multiple: true
          # Conserva los ZIP portables originales para adjuntarlos al release.
          skip-decompress: true
      - name: Create test draft
        id: draft
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.DRAFT_TAG }}
          target_commitish: ${{ github.sha }}
          name: Workflow test ${{ github.run_id }}-${{ github.run_attempt }}
          draft: true
          make_latest: 'false'
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          body: ${{ env.RELEASE_DESCRIPTION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ env.RELEASE_FILES }}

      - name: Show test draft
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          DRAFT_URL: ${{ steps.draft.outputs.url }}
        run: '"Test draft: $env:DRAFT_URL" >> $env:GITHUB_STEP_SUMMARY'

      - name: Publish automatic release
        id: published
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          # Las versiones preliminares no sustituyen a la última estable.
          make_latest: ${{ needs.version.outputs.prerelease == 'true' && 'false' || 'legacy' }}
          body: ${{ env.RELEASE_DESCRIPTION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ env.RELEASE_FILES }}

      # latest.json y el JSON de versión contienen el mismo manifiesto.
      - name: Generate release JSON files
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id || steps.published.outputs.id }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const { createHash } = require('node:crypto');
            const version = process.env.RELEASE_VERSION;
            const tag = `v${version}`;
            const { data: release } = await github.rest.repos.getRelease({
              ...context.repo, release_id: Number(process.env.RELEASE_ID)
            });
            if (!release.draft && (release.tag_name !== tag || !release.published_at)) {
              throw new Error('Published release metadata does not match the project version.');
            }
            const variants = {};
            for (const [variant, suffix] of Object.entries({
              installer: 'setup.exe', portable: 'portable.zip', portableLight: 'portable-light.zip'
            })) {
              const filename = `Qapptia-${tag}-win-x64-${suffix}`;
              const asset = release.assets.find(item => item.name === filename);
              if (!asset || asset.state !== 'uploaded' || !asset.browser_download_url) {
                throw new Error(`Missing uploaded release asset: ${filename}`);
              }
              const file = path.join('dist', filename);
              const { size } = await fs.stat(file);
              const sha256 = createHash('sha256').update(await fs.readFile(file)).digest('hex');
              if (size !== asset.size || (asset.digest && asset.digest !== `sha256:${sha256}`)) {
                throw new Error(`Release asset differs from the generated package: ${filename}`);
              }
              variants[variant] = {
                filename, url: asset.browser_download_url, alternativeMirrorUrl: null,
                sizeMB: Number((size / 1_000_000).toFixed(2)), sha256
              };
            }
            // Extrae las notas del release excluyendo la descripción de los paquetes.
            const body = release.body || '';
            const description = process.env.RELEASE_DESCRIPTION.trim();
            const notes = (body.startsWith(description) ? body.slice(description.length) : body).trim();
            const manifest = {
              version, isEnabled: !release.draft,
              publishedAt: release.draft ? null : release.published_at,
              siteDownload: process.env.RELEASE_DOWNLOAD_URL,
              siteSponsor: process.env.RELEASE_SPONSOR_URL,
              siteRepositoryGH: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`,
              changelog: notes ? [notes] : [],
              platform: {
                windows: { isAvailable: true, variants },
                linux: { isAvailable: false, variants: null },
                macos: { isAvailable: false, variants: null }
              },
              isCritical: false, minSupportedVersion: null
            };
            const latest = path.join('dist', 'latest.json');
            await fs.writeFile(latest, JSON.stringify(manifest, null, 2) + '\n', 'utf8');
            await fs.copyFile(latest, path.join('dist', `${tag}.json`));
            core.info(`Generated latest.json and ${tag}.json with identical content.`);

      # Almacena los manifiestos como artefactos independientes de Actions.
      - name: Store latest release JSON
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: error
          path: dist/latest.json

      - name: Store versioned release JSON
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: error
          path: dist/v${{ needs.version.outputs.version }}.json

      # Publica latest.json después del manifiesto de versión.
      - name: Upload release manifests to FTP
        if: steps.published.outcome == 'success' || steps.draft.outcome == 'success'
        shell: pwsh
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          FTP_PORT: ${{ vars.FTP_PORT || secrets.FTP_PORT }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_FILE_PREFIX: ${{ steps.draft.outcome == 'success' && 'draft_' || '' }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          if (-not $env:FTP_SERVER -or -not $env:FTP_USERNAME -or -not $env:FTP_PASSWORD) {
            throw 'Set FTP_SERVER and FTP_USERNAME in repository variables or secrets, and FTP_PASSWORD in repository secrets.'
          }
          if ([Uri]::CheckHostName($env:FTP_SERVER) -eq [UriHostNameType]::Unknown) {
            throw 'FTP_SERVER must contain a hostname or IP address.'
          }

          $ftpRoot = [UriBuilder]::new('ftp', $env:FTP_SERVER, [int]$env:FTP_PORT).Uri.AbsoluteUri
          # La doble barra selecciona una ruta desde la raíz del servidor.
          $destination = "$ftpRoot/versions/"
          $credentials = "${env:FTP_USERNAME}:${env:FTP_PASSWORD}"
          foreach ($filename in @("v$env:RELEASE_VERSION.json", 'latest.json')) {
            $remoteName = "${env:FTP_FILE_PREFIX}$filename"
            curl.exe --silent --show-error --connect-timeout 15 --max-time 90 --retry 2 `
              --user $credentials --upload-file "dist/$filename" --url "$destination$remoteName"
            if ($LASTEXITCODE -ne 0) {
              throw "FTP upload failed for $remoteName (curl exit code $LASTEXITCODE)."
            }
          }
